worker_processes  1;

events {
    worker_connections  1024;
}

http {
    server {
        listen 80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # All API traffic goes to the api-gateway, which owns the per-route
        # map (api-gateway/templates/default.conf.template - the single
        # routing table for every environment). This file only needs the
        # stable catch-all below. 127.0.0.11 is Docker's embedded DNS server
        # on a user-defined bridge network; in the cluster the Helm configmap
        # replaces this whole file with one pointing at kube-dns (see
        # frontend-nginx-configmap.yaml). Resolving via a variable + this
        # resolver, rather than a bare
        # hostname in proxy_pass, means nginx looks the name up lazily
        # per-request instead of once at startup, so the frontend still
        # starts and serves the UI even if the gateway isn't up yet.
        #
        # The Helm chart does NOT use this file - it mounts its own copy
        # (templates/frontend-nginx-configmap.yaml) with a cluster-appropriate
        # resolver, since Kubernetes' in-cluster DNS server has no fixed IP
        # like Docker's does. Both are just this one catch-all now, so they
        # only need syncing if the proxy *behavior* changes, never for routes.
        resolver 127.0.0.11 valid=10s;

        location /api/ {
            set $api_gateway api-gateway;
            proxy_pass http://$api_gateway:8080$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            # GET /api/orders is streamed as text/event-stream (SSE);
            # buffering would hold events until nginx's buffer fills instead
            # of forwarding each one as it arrives. Applying the SSE settings
            # to all /api/ traffic costs nothing for the small non-streaming
            # responses and keeps this location route-agnostic.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}