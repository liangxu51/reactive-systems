server.port=8082
spring.mongodb.uri=mongodb://localhost:27017/reactive-systems
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# See issue #40: with a 3-broker "orders" topic (min.insync.replicas=2),
# acks=all blocks a produce until every in-sync replica has the write, not
# just the leader - a leader that dies right after acking would otherwise
# silently drop the message for any lagging follower promoted in its place.
spring.kafka.producer.acks=all
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.baeldung.domain.Order