# Profile for the Testcontainers dev launcher
# (TestVirtualThreadOrderApplication) only - test-scoped, so it is never
# packaged into the image.
#
# Without a fixed credential Spring Boot generates a random password on every
# boot and logs it, so each restart means grepping the console before you can
# curl anything. Pinning it makes the dev loop scriptable. This is not a
# secret: it only ever guards a throwaway local process.
spring.security.user.name=dev
spring.security.user.password=dev

# Jaeger is not part of the local dev loop, and without this the OTel exporter
# retries a missing collector every few seconds and floods the console with
# stack traces that bury the app's own logs.
management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
