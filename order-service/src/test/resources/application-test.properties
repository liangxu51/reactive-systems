# SEC-001: SecurityConfig now requires HTTP Basic auth on every request.
# Fixed test-only credentials so WebTestClient calls are deterministic -
# never used outside the test classpath.
#
# This is a *profile* file (activated by @ActiveProfiles("test")) rather than
# a plain application.properties. A test-scoped application.properties shadows
# the main one outright - classpath resolution returns the first match and test
# resources come first - which silently drops every setting in
# src/main/resources/application.properties, Kafka's JsonSerializer included.
# Profile files layer on top of the main config instead of replacing it.
spring.security.user.name=test
spring.security.user.password=test-only-not-a-real-credential

# These tests mock OrderProducer and disable listener auto-startup, so no
# broker is needed - but KafkaAdmin still probes the configured
# bootstrap-servers at startup and blocks the context for its full 60s
# timeout. Skip the admin bean entirely; without this the suite takes ~82s
# instead of ~20s.
spring.kafka.admin.auto-create=false
