# Feeds OTel's Resource service.name attribute (#46) - without it every
# service reports as the SDK's generic "unknown_service" default, and Jaeger
# can't tell which span came from which service even though the trace itself
# is still correctly linked end-to-end. Confirmed live: omitting this left
# every pod indistinguishable in the Jaeger UI.
spring.application.name=inventory-service
server.port=8081
spring.mongodb.uri=mongodb://localhost:27017/reactive-systems
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# See issue #40: with a 3-broker "orders" topic (min.insync.replicas=2),
# acks=all blocks a produce until every in-sync replica has the write, not
# just the leader - a leader that dies right after acking would otherwise
# silently drop the message for any lagging follower promoted in its place.
spring.kafka.producer.acks=all
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.baeldung.domain.Order
# Consumer lag is scraped by kafka-lag-exporter directly from the brokers (#44) -
# this only exposes this service's own JVM/HTTP metrics for Prometheus, behind
# the same HTTP Basic auth as every other endpoint (see SecurityConfig).
management.endpoints.web.exposure.include=health,prometheus
# Boot only exposes http.server.requests as a summary (_count/_sum/_max) by
# default - the Grafana dashboard's p99 latency panel needs the actual
# _bucket series for histogram_quantile(), which requires this explicitly.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Distributed tracing across the Kafka saga (#46). These two enable Spring
# Kafka's built-in Observation support on the producer/listener container,
# which - because micrometer-tracing-bridge-otel is on the classpath - both
# creates a span per send/receive AND propagates the current trace context
# through the record's own headers automatically (W3C traceparent by
# default), with no manual header code in the producer/consumer classes.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# Every request traced, not a sampled fraction - fine at this demo's traffic
# volume, would need lowering under real production load.
management.tracing.sampling.probability=1.0
# Micrometer's Observation (and with it, the current trace/span) lives in a
# ThreadLocal, but this service's request path hops threads on every step
# (WebFlux handler -> reactive Mongo callback -> Kafka send, or the
# @KafkaListener thread -> reactive Mongo callback -> Kafka send for the
# consumer side). Reactor's DEFAULT context-propagation mode ("limited")
# doesn't bridge that: confirmed live, producer spans showed up in Jaeger as
# disconnected root traces instead of children of their originating span.
# "auto" enables Hooks.enableAutomaticContextPropagation(), which snapshots/
# restores every registered ThreadLocalAccessor (Micrometer's Observation
# among them) across Reactor operator and thread boundaries automatically.
spring.reactor.context-propagation=auto
# Structured JSON logging with correlation fields (#47). ECS (Elastic Common
# Schema) is one of Boot's built-in formats - no extra dependency needed.
# Because micrometer-tracing is already on the classpath (#46), every log
# line gets trace.id/span.id fields automatically; MDC entries (see
# MdcPropagationConfig, orderId in particular) come along as top-level
# fields too, so log lines can be filtered/correlated by order ID or trace
# ID without grepping free text.
logging.structured.format.console=ecs
