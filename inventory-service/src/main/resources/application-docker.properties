server.port=8081
spring.mongodb.uri=mongodb://mongo-db:27017/reactive-systems?replicaSet=rs0
spring.kafka.bootstrap-servers=kafka-broker:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# See issue #40: with a 3-broker "orders" topic (min.insync.replicas=2),
# acks=all blocks a produce until every in-sync replica has the write, not
# just the leader - a leader that dies right after acking would otherwise
# silently drop the message for any lagging follower promoted in its place.
spring.kafka.producer.acks=all
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.baeldung.domain.Order
management.endpoints.web.exposure.include=health,prometheus
# Distributed tracing across the Kafka saga (#46) - see application.properties
# for why these two enable automatic trace-context propagation through Kafka
# headers. jaeger:4318 overrides the OTLP exporter's localhost default to
# reach the in-cluster Jaeger Service (see templates/jaeger.yaml).
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://jaeger:4318/v1/traces
# See application.properties for why this is needed - Reactor's default
# context-propagation mode doesn't bridge Observation's ThreadLocal across
# this service's WebFlux/reactive-Mongo/Kafka thread hops.
spring.reactor.context-propagation=auto