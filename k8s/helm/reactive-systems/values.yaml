# Default values target a local minikube cluster.
# Build the service images into minikube's own Docker daemon first, tagging
# them with this chart's appVersion (see Chart.yaml) rather than "latest":
#   eval $(minikube docker-env)
#   mvn clean package -pl order-service,inventory-service,shipping-service
#   TAG=$(grep '^appVersion' Chart.yaml | cut -d '"' -f2)
#   docker build -t order-service:$TAG order-service
#   docker build -t inventory-service:$TAG inventory-service
#   docker build -t shipping-service:$TAG shipping-service
#   (cd frontend && npm ci && npm run build) && docker build -t frontend:$TAG frontend
#
# imagePullPolicy stays IfNotPresent (no registry backs these images, so
# Always would just fail trying to pull them) - bump appVersion in Chart.yaml
# before each rebuild instead, so every image gets a unique tag and nodes
# never serve a stale cached image. Per-service image.tag below defaults to
# appVersion when left blank; override it (e.g. --set orderService.image.tag=foo)
# for an ad hoc build without bumping the chart version.
imagePullPolicy: IfNotPresent

# Pull credentials for a real registry (#58) - empty by default, matching
# the local-minikube flow above where images never need one. CI's
# ephemeral-cluster smoke test and a real deploy-target cluster set this via
# --set imagePullSecrets[0].name=ghcr-pull (see .github/workflows/ci.yml).
imagePullSecrets: []

mongodb:
  image: mongo:4.4
  # Matches the hostname baked into application-docker.properties.
  serviceName: mongo-db
  port: 27017
  # 3 voting members so the replica set has a real majority (2) and survives
  # losing any one pod - see mongodb.yaml/mongo-init-replicaset.yaml.
  replicaCount: 3
  persistence:
    enabled: true
    size: 1Gi
  # WiredTiger's default cache formula - max((RAM - 1GB) / 2, 256MB) - sizes
  # off the node's total RAM, not this container's cgroup limit, so it can
  # size itself larger than the limit below and get OOM-killed. Pin it
  # explicitly instead, leaving headroom under memory.limits for connections,
  # the OS page cache, etc.
  wiredTigerCacheSizeGB: "0.25"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  auth:
    # Usernames aren't secret, only the passwords - those are generated
    # once per release and persisted in the mongo-credentials Secret (see
    # templates/mongo-secret.yaml) rather than living here in plain values.
    rootUsername: root
    appUsername: reactive-systems-app
    # Least-privilege identity for mongodump (see templates/mongo-backup.yaml)
    # - granted only the built-in 'backup' role, not readWrite/root.
    backupUsername: reactive-systems-backup
    # Least-privilege identity for mongodb_exporter (#55, see
    # templates/mongodb-exporter.yaml) - granted only the built-in
    # 'clusterMonitor' role, not readWrite/root.
    monitorUsername: reactive-systems-monitor
  # Scheduled mongodump backups (#36) - see templates/mongo-backup.yaml.
  # Lands on a local PVC, not off-cluster object storage: this chart targets
  # a single-node minikube dev cluster (see header above), so it protects
  # against accidental deletes/bad writes/replica-set corruption, but NOT
  # against losing the node/cluster entirely. Point retentionDays' pruning
  # and the destination at real off-cluster storage before using this
  # pattern anywhere durability actually matters.
  backup:
    enabled: true
    # Daily at 02:00.
    schedule: "0 2 * * *"
    retentionDays: 7
    persistence:
      size: 2Gi

api:
  auth:
    # Shared HTTP Basic credential across order-service/order-service-vt/
    # inventory-service (SEC-001, PR #72) - see MODERNIZATION_BRIEF.md's
    # target architecture note on a shared operator credential. Username
    # isn't secret, only the password - that's generated once per release
    # and persisted in the api-credentials Secret (see
    # templates/api-secret.yaml) rather than living here in plain values.
    username: admin

kafka:
  image: confluentinc/cp-kafka:7.4.0
  # Matches the hostname baked into application-docker.properties. Stays a
  # normal (non-headless) Service - see kafka.yaml's headlessServiceName for
  # why per-pod DNS lives on a second, separate Service instead of turning
  # this one headless: spec.clusterIP is immutable, so flipping an
  # already-assigned ClusterIP to None here would break `helm upgrade` on
  # every release installed before #40.
  serviceName: kafka-broker
  # Headless governing Service for the StatefulSet - gives each broker pod
  # its own stable per-pod DNS name (kafka-broker-0.kafka-broker-headless...)
  # for KAFKA_ADVERTISED_LISTENERS, without touching kafka-broker itself.
  headlessServiceName: kafka-broker-headless
  port: 9092
  # KRaft's inter-controller Raft consensus port (issue #41) - internal
  # traffic between broker/controller-role nodes only, never something a
  # client connects to. Zookeeper (and its own client/peer ports) is gone
  # entirely now that brokers replicate their own metadata log instead.
  controllerPort: 9093
  # 3 brokers (StatefulSet, see kafka.yaml) so losing any one broker no
  # longer stalls every producer/consumer across all three services - see
  # issue #40. broker.id is derived per-pod from the StatefulSet ordinal
  # rather than set here.
  replicaCount: 3
  # Each broker's log dir - without a real PVC behind it, a pod eviction or
  # node drain wipes that broker's entire committed log (ephemeral container
  # filesystem), and losing more than one broker at once would permanently
  # lose data despite acks=all/minInsyncReplicas below. disable for the old
  # ephemeral emptyDir behavior.
  persistence:
    enabled: true
    size: 1Gi
  # Internal __consumer_offsets topic - matches replicaCount so consumer
  # group offsets survive a broker loss too.
  offsetsTopicReplicationFactor: 3
  # Applies to auto-created topics (auto.create.topics.enable defaults to
  # true on this image) - covers the "orders" topic, since nothing here
  # creates it explicitly. Only takes effect for topics auto-created after
  # this is set; see README's Kafka HA section for upgrading an
  # already-existing "orders" topic.
  defaultReplicationFactor: 3
  # A produce with acks=all (see application-docker.properties) blocks
  # until this many in-sync replicas have the write, not just the leader -
  # 2 of 3 is the largest value that still tolerates one broker being down
  # without producers failing outright.
  minInsyncReplicas: 2

orderService:
  enabled: true
  image:
    repository: order-service
    tag: ""
  containerPort: 8080
  servicePort: 8080
  replicaCount: 1

# Virtual-thread variant of order-service (see order-service-vt module).
# Mutually exclusive with orderService: both would consume/produce on the
# same Kafka topic and Mongo collection, mirroring the docker-compose
# profiles "order-service" / "order-service-vt".
orderServiceVt:
  enabled: false
  image:
    repository: order-service-vt
    tag: ""
  containerPort: 8083
  servicePort: 8080
  replicaCount: 1

inventoryService:
  image:
    repository: inventory-service
    tag: ""
  containerPort: 8081
  servicePort: 8081
  replicaCount: 1

shippingService:
  image:
    repository: shipping-service
    tag: ""
  replicaCount: 1

# Consumer lag monitoring (#44) - kafka-lag-exporter reads committed offsets
# and log-end-offsets straight from the brokers/__consumer_offsets, so it
# covers every consumer group's lag (including shipping-service's, which has
# no HTTP port of its own to scrape) without needing any app-side changes.
kafkaLagExporter:
  image: seglo/kafka-lag-exporter:0.8.2
  port: 8000
  pollIntervalSeconds: 30
  # How many poll cycles of offset history to keep per partition, used to
  # estimate lag in time (kafka_consumergroup_group_lag_seconds) as well as
  # message count - 60 * pollIntervalSeconds (30s) = 30 minutes of history.
  lookupTableSize: 60

# Centralized monitoring & alerting (#55) - kube-prometheus-stack subchart
# (Prometheus Operator + Grafana + Alertmanager + kube-state-metrics +
# node-exporter). Replaces the hand-rolled single-replica Prometheus from
# #44 (see Chart.yaml's dependencies block) - custom scrape targets/alerts
# below are expressed as ServiceMonitor/PrometheusRule CRDs instead of a
# hand-edited ConfigMap (see monitoring-servicemonitors.yaml/
# monitoring-rules.yaml), which this Operator picks up automatically.
kube-prometheus-stack:
  enabled: true
  prometheus:
    prometheusSpec:
      # By default the Operator only watches ServiceMonitors/PodMonitors/
      # PrometheusRules carrying a `release: <this subchart's release name>`
      # label - our own hand-written ones (living in the parent chart, not a
      # separately-labeled sub-release) don't carry it. Without these three
      # overrides every custom ServiceMonitor/PrometheusRule below is
      # silently ignored: nothing errors, the targets/alerts just never show
      # up. Confirmed live against a real Operator deployment.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
  alertmanager:
    enabled: true
    # No Slack/PagerDuty/email credential exists anywhere in this repo -
    # alerts are visible/routed in Alertmanager's own UI/API but not pushed
    # anywhere until a real receiver is configured. Deliberately not
    # inventing a fake webhook here.
    config:
      route:
        receiver: "null"
      receivers:
        - name: "null"
  grafana:
    enabled: true
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      size: 2Gi
    sidecar:
      dashboards:
        enabled: true
    # Loki self-registers as a datasource on THIS Grafana (#54) via a
    # ConfigMap the loki-stack subchart creates, labeled grafana_datasource:
    # "1" - the same sidecar.datasources mechanism used above for
    # auto-discovering ServiceMonitors/PrometheusRules, just for
    # datasources. No manual additionalDataSources entry needed here (and
    # adding one would just create a duplicate "Loki" datasource alongside
    # the auto-discovered one - confirmed via `helm template` before
    # settling on this). loki-stack's own Grafana subchart stays disabled
    # (see loki-stack.grafana.enabled below) so there's exactly one Grafana
    # in this deployment, with Loki wired into it as a second datasource
    # alongside Prometheus.
  defaultRules:
    # Ships alerts like KubePodCrashLooping (kube-state-metrics-based) for
    # free - covers the "pod restart loops" failure mode from the issue
    # without any custom rule.
    create: true

# MongoDB replica-set visibility (#55) - no exporter previously existed, so
# InvalidReplicaSetConfig/no-primary states (see #55's problem statement)
# were only noticed when a user reported a broken page. One exporter
# instance covers the whole 3-member rs0 replica set (queries rs.status()
# against any reachable member), so this isn't one-per-pod.
mongodbExporter:
  image: percona/mongodb_exporter:0.44
  port: 9216

# Kafka broker-level visibility (#55) - kafka-lag-exporter (#44) only covers
# consumer lag, not broker health (under-replicated partitions, broker
# up/down). kafka_exporter talks the Kafka wire protocol directly against
# the existing PLAINTEXT listener, so it needs zero changes to kafka.yaml's
# StatefulSet (no JMX port/javaagent to inject).
kafkaExporter:
  image: danielqsj/kafka-exporter:v1.7.0
  port: 9308

# Sustained per-partition lag (messages) before KafkaConsumerGroupLagHigh
# fires - picked as "clearly not normal for this demo's traffic", not
# derived from a real throughput SLA. Tune to your own workload.
monitoringRules:
  lagAlertThreshold: 500

# Centralized logging (#54) - loki-stack subchart (single-binary Loki + a
# Promtail DaemonSet). See Chart.yaml's dependencies block.
loki-stack:
  enabled: true
  loki:
    persistence:
      enabled: true
      size: 5Gi
    config:
      table_manager:
        # 7 days, matching the mongodb.backup.retentionDays precedent above
        # rather than picking an arbitrary new number.
        retention_deletes_enabled: true
        retention_period: 168h
  promtail:
    config:
      # Points explicitly at the loki subchart's rendered Service name
      # (confirmed via `helm template`, not the chart's own tpl default,
      # which resolves to plain "{{ .Release.Name }}" - i.e. just
      # "reactive-systems" with no "-loki" suffix - and would silently push
      # logs nowhere reachable under this chart's release name).
      clients:
        - url: http://reactive-systems-loki:3100/loki/api/v1/push
      snippets:
        pipelineStages:
          # Container runtime log framing (default stage, kept).
          - cri: {}
          # Logs are already flat ECS JSON (#47) - no grok/regex needed,
          # just parse the fields worth promoting to Loki labels for
          # correlation with Jaeger traces (traceId/spanId) and the order
          # saga (orderId).
          - json:
              expressions:
                level: log.level
                service: service.name
                traceId: traceId
                spanId: spanId
                orderId: orderId
          - labels:
              level:
              service:
  # loki-stack can deploy its own Grafana - explicitly disabled so there's
  # exactly one Grafana in this deployment (kube-prometheus-stack's above),
  # with Loki wired in as a datasource on it instead.
  grafana:
    enabled: false

# Distributed tracing across the Kafka saga (#46) - single jaegertracing/
# all-in-one Deployment (collector + in-memory storage + query API + UI),
# see templates/jaeger.yaml.
jaeger:
  image: jaegertracing/all-in-one:1.60
  otlpGrpcPort: 4317
  otlpHttpPort: 4318
  uiPort: 16686

frontend:
  image:
    repository: frontend
    tag: ""
  containerPort: 80
  servicePort: 80
  replicaCount: 1
  service:
    # NodePort so `minikube service frontend` can open it from the host.
    type: NodePort
  # ClusterIP of the in-cluster DNS server, used by nginx to resolve
  # order-service/inventory-service when proxying /api/* (see
  # templates/frontend-nginx-configmap.yaml). 10.96.0.10 is CoreDNS's address
  # on a stock minikube install (kubeadm's default 10.96.0.0/12 service CIDR).
  # If your cluster differs, override with:
  #   --set frontend.dnsResolverIP=$(kubectl get svc kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}')
  dnsResolverIP: "10.96.0.10"
