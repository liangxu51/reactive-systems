# Password generated once (not committed to values.yaml) and persisted
# across `helm upgrade` via `lookup` - without this, every upgrade would
# mint a new random password, locking an operator out of a Grafana session
# they thought was still valid. Same pattern as mongo-secret.yaml/
# api-secret.yaml, referenced by kube-prometheus-stack.grafana.admin.
# existingSecret in values.yaml.
{{- if index .Values "kube-prometheus-stack" "enabled" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "grafana-admin" }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    {{- include "reactive-systems.labels" . | nindent 4 }}
type: Opaque
data:
  admin-user: {{ or (dig "data" "admin-user" "" $existing) ("admin" | b64enc) }}
  admin-password: {{ or (dig "data" "admin-password" "" $existing) (randAlphaNum 32 | b64enc) }}
{{- end }}
