# Overrides the nginx.conf baked into the frontend image (frontend/nginx.conf)
# so its /api/ proxy_pass resolves via the cluster's DNS server instead of
# Docker's fixed 127.0.0.11 embedded DNS, which only exists under
# docker-compose. All per-route knowledge lives in the api-gateway image
# (api-gateway/templates/default.conf.template); this file and
# frontend/nginx.conf are each just the stable catch-all below, so they only
# need syncing if the proxy *behavior* changes, never for routes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  labels:
    app: frontend
    {{- include "reactive-systems.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes  1;

    events {
        worker_connections  1024;
    }

    http {
        server {
            listen 80;
            server_name  localhost;

            root   /usr/share/nginx/html;
            index  index.html index.htm;
            include /etc/nginx/mime.types;

            gzip on;
            gzip_min_length 1000;
            gzip_proxied expired no-cache no-store private auth;
            gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

            location / {
                try_files $uri $uri/ /index.html;
            }

            resolver {{ .Values.frontend.dnsResolverIP }} valid=10s;

            location /api/ {
                # FQDN required: nginx's resolver directive queries kube-dns
                # directly and does not apply the pod's /etc/resolv.conf
                # search domains the way glibc/musl does, so a bare
                # short name like "api-gateway" gets SERVFAIL.
                set $api_gateway api-gateway.{{ .Release.Namespace }}.svc.cluster.local;
                proxy_pass http://$api_gateway:{{ .Values.apiGateway.servicePort }}$request_uri;
                proxy_http_version 1.1;
                proxy_set_header Connection '';
                # SSE settings applied to all /api/ traffic - negligible cost
                # for the small non-streaming responses, and this location
                # stays route-agnostic.
                proxy_buffering off;
                proxy_read_timeout 1h;
            }
        }
    }
