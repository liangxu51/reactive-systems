# Bare-bones Prometheus (#44) - single replica, no Alertmanager, no remote
# write. Scrapes kafka-lag-exporter for consumer-group lag plus each
# web-enabled service's own /actuator/prometheus (order-service,
# order-service-vt, inventory-service - shipping-service has no HTTP port,
# see kafka-lag-exporter.yaml for why that's still fully covered), and
# evaluates kafka-lag-alerts.yml. "Evaluates", not "routes": with no
# Alertmanager configured, a firing alert only shows up on Prometheus's own
# /alerts page - see README for wiring up real alert delivery.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
    {{- include "reactive-systems.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeIntervalSeconds }}s

    rule_files:
      - /etc/prometheus/kafka-lag-alerts.yml

    scrape_configs:
      - job_name: kafka-lag-exporter
        static_configs:
          - targets: [{{ printf "kafka-lag-exporter:%v" .Values.kafkaLagExporter.port | quote }}]

      - job_name: order-service
        metrics_path: /actuator/prometheus
        basic_auth:
          username: {{ .Values.api.auth.username | quote }}
          password_file: /etc/prometheus/secrets/api-credentials/password
        static_configs:
          # order-service and order-service-vt are mutually exclusive and share
          # the same "order-service" Service name (see order-service-vt.yaml) -
          # scrape whichever one's actually enabled, on its own service port.
          - targets: [{{ printf "order-service:%v" (ternary .Values.orderServiceVt.servicePort .Values.orderService.servicePort .Values.orderServiceVt.enabled) | quote }}]

      - job_name: inventory-service
        metrics_path: /actuator/prometheus
        basic_auth:
          username: {{ .Values.api.auth.username | quote }}
          password_file: /etc/prometheus/secrets/api-credentials/password
        static_configs:
          - targets: [{{ printf "inventory-service:%v" .Values.inventoryService.servicePort | quote }}]

  # kafka_consumergroup_group_max_lag is kafka-lag-exporter's per-group
  # worst-partition lag (labeled by cluster_name/group only - confirmed live
  # against a real exporter that it carries no "topic" label, unlike the
  # per-partition kafka_consumergroup_group_lag_seconds metric, even though
  # this cluster only ever has the one "orders" topic anyway) - alerting on
  # this one series catches "some partition of this group is stuck" without
  # needing to sum across partitions ourselves. Threshold is
  # prometheus.lagAlertThreshold (values.yaml).
  kafka-lag-alerts.yml: |
    groups:
      - name: kafka-consumer-lag
        rules:
          - alert: KafkaConsumerGroupLagHigh
            expr: kafka_consumergroup_group_max_lag{cluster_name="reactive-systems"} > {{ .Values.prometheus.lagAlertThreshold }}
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Consumer group {{`{{ $labels.group }}`}} is falling behind on the orders topic"
              description: "{{`{{ $labels.group }}`}}'s worst-lagging partition has been over {{ .Values.prometheus.lagAlertThreshold }} messages behind for 5+ minutes - check whether it's stuck or under-provisioned."
---
{{- if .Values.prometheus.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    app: prometheus
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Confirmed live: the default RollingUpdate strategy starts the new pod
  # before killing the old one, and both then try to mount prometheus-data
  # (ReadWriteOnce) at once - minikube's storage class let both pods mount
  # it concurrently rather than blocking the second one, so the new pod
  # crash-looped instead ("lock DB directory: resource temporarily
  # unavailable") because Prometheus's own TSDB lock file was still held by
  # the old pod. Recreate avoids the overlap by tearing down the old pod
  # first - a brief scrape/query gap on every upgrade, acceptable for a
  # single-replica, non-HA deployment like this one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # Kubernetes doesn't restart pods just because a mounted ConfigMap
        # changed, and Prometheus doesn't hot-reload its own config/rule
        # files without --web.enable-lifecycle - confirmed live: a
        # `helm upgrade` that only changed prometheus-config left the
        # already-running pod serving the old rules indefinitely. Hashing
        # the values that feed prometheus-config's data (not this whole
        # template file - self-including it via $.Template.BasePath recurses
        # infinitely, since the Deployment being rendered is itself part of
        # what gets included) into a pod annotation forces a rollout instead.
        checksum/config: {{ dict "prometheus" .Values.prometheus "kafkaLagExporterPort" .Values.kafkaLagExporter.port "apiUsername" .Values.api.auth.username "orderService" .Values.orderService "orderServiceVt" .Values.orderServiceVt "inventoryService" .Values.inventoryService | toYaml | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-kafka-lag-exporter
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka-lag-exporter {{ .Values.kafkaLagExporter.port }}; do
                echo waiting for kafka-lag-exporter; sleep 2;
              done
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: api-credentials
          secret:
            secretName: api-credentials
        - name: data
          {{- if .Values.prometheus.persistence.enabled }}
          persistentVolumeClaim:
            claimName: prometheus-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image }}"
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: api-credentials
              mountPath: /etc/prometheus/secrets/api-credentials
              readOnly: true
            - name: data
              mountPath: /prometheus
          ports:
            - containerPort: {{ .Values.prometheus.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.prometheus.port }}
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.prometheus.port }}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  selector:
    app: prometheus
  ports:
    - port: {{ .Values.prometheus.port }}
      targetPort: {{ .Values.prometheus.port }}
