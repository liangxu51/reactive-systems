# Passwords and the replica-set keyfile are generated once (not committed
# to values.yaml) and persisted across `helm upgrade` via `lookup` - without
# this, every upgrade would mint new random values, locking out the users
# already provisioned in Mongo's data files by the mongo-init sidecar in
# mongodb.yaml.
#
# `lookup` alone only covers upgrades. On `helm uninstall` this Secret would
# be deleted while the StatefulSet's PVCs survive (Kubernetes never garbage-
# collects those), so the next install would generate fresh passwords against
# a data directory whose users still hold the old ones - every service then
# fails with "Authentication failed ... SCRAM-SHA-256" and no copy of the old
# password exists anywhere to recover from. resource-policy: keep makes this
# Secret's lifecycle match the PVCs it has to agree with: both survive an
# uninstall, so a reinstall reuses the passwords Mongo already knows.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "mongo-credentials" }}
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "reactive-systems.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ or (dig "data" "root-password" "" $existing) (randAlphaNum 32 | b64enc) }}
  app-password: {{ or (dig "data" "app-password" "" $existing) (randAlphaNum 32 | b64enc) }}
  backup-password: {{ or (dig "data" "backup-password" "" $existing) (randAlphaNum 32 | b64enc) }}
  # Least-privilege identity for mongodb_exporter (#55, see
  # templates/mongodb-exporter.yaml) - granted only the built-in
  # 'clusterMonitor' role, not readWrite/root.
  monitor-password: {{ or (dig "data" "monitor-password" "" $existing) (randAlphaNum 32 | b64enc) }}
  # Internal auth between replica-set members - MongoDB requires the same
  # keyfile content on every mongod in the set (see mongodb.yaml).
  keyfile: {{ or (dig "data" "keyfile" "" $existing) (randAlphaNum 756 | b64enc) }}
