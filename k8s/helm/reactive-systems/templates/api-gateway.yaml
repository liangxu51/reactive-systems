# The API gateway is the same image compose runs - the entire /api/* routing
# table lives in the image (api-gateway/templates/default.conf.template) and
# environment differences are expressed purely as env vars below, so there is
# no cluster-side copy of the routing table to keep in sync.
{{- /* Every order-service variant publishes the same Service name on
servicePort 8080, but resolve the port from whichever variant is enabled so
a future port change can't silently desync the gateway. */}}
{{- $orderPort := .Values.orderService.servicePort }}
{{- if .Values.orderServiceVt.enabled }}{{ $orderPort = .Values.orderServiceVt.servicePort }}{{ end }}
{{- if .Values.orderServiceCs.enabled }}{{ $orderPort = .Values.orderServiceCs.servicePort }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      {{- include "reactive-systems.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.containerPort }}
          env:
            # Same FQDN-required reasoning as the frontend configmap: nginx's
            # resolver queries kube-dns directly and skips resolv.conf search
            # domains, so bare short names would SERVFAIL.
            - name: RESOLVER
              value: {{ .Values.frontend.dnsResolverIP | quote }}
            # All order-service variants (Java/vt/C#) publish the same
            # Service name, so no override is needed when switching variants
            # - unlike docker-compose, where ORDER_UPSTREAM must name the
            # variant's container.
            - name: ORDER_UPSTREAM
              value: "order-service.{{ .Release.Namespace }}.svc.cluster.local:{{ $orderPort }}"
            - name: INVENTORY_UPSTREAM
              value: "inventory-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.inventoryService.servicePort }}"
            # The credential the gateway injects as "Authorization: Basic"
            # on every proxied request - the same identity the backends
            # verify (see _helpers.tpl apiAuthEnv / api-secret.yaml).
            - name: API_AUTH_USERNAME
              value: {{ .Values.api.auth.username | quote }}
            - name: API_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: password
          resources:
            {{- toYaml .Values.appResources.nginx | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.apiGateway.containerPort }}
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.apiGateway.containerPort }}
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.servicePort }}
      targetPort: {{ .Values.apiGateway.containerPort }}
