# Auto-loaded by kube-prometheus-stack's Grafana sidecar (#55, sidecar.
# dashboards.enabled in values.yaml watches for this label). One overview
# dashboard rather than several - kube-prometheus-stack's own bundled
# dashboards already cover generic cluster/pod/node visibility, so this one
# stays scoped to this app's own signals. Log panels (#54, Loki) are folded
# into this same dashboard rather than a second one, since both metrics and
# logs share this one Grafana.
#
# The Jaeger panel (id 9) is deliberately "table", not "traces": confirmed
# live via an actual headless-browser render (not just checking the API
# response) that Grafana's core "traces" panel type expects a single
# trace's spans, not a multi-trace search-result list - given a `search`
# queryType's response, it silently showed "No data found in response"
# even though the underlying request succeeded with real data. Also
# filtered to the `http post /api/orders` operation specifically - without
# it, the panel's top 20 results were dominated by Prometheus's own
# /actuator/prometheus scrape spans (every ~30s) rather than the saga's
# actual entry point.
{{- if index .Values "kube-prometheus-stack" "enabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: reactive-systems-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "reactive-systems.labels" . | nindent 4 }}
data:
  reactive-systems-overview.json: |
    {
      "title": "reactive-systems overview",
      "uid": "reactive-systems-overview",
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "title": "Order pipeline request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": null,
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=~\"order-service|inventory-service\"}[5m])) by (job, uri, status)",
              "legendFormat": "{{`{{job}}`}} {{`{{uri}}`}} {{`{{status}}`}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Order pipeline p99 latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": null,
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=~\"order-service|inventory-service\"}[5m])) by (le, job, uri))",
              "legendFormat": "{{`{{job}}`}} {{`{{uri}}`}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Kafka consumer group lag",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": null,
          "targets": [
            {
              "expr": "kafka_consumergroup_group_max_lag{cluster_name=\"reactive-systems\"}",
              "legendFormat": "{{`{{group}}`}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "MongoDB replica set member state",
          "type": "state-timeline",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": null,
          "targets": [
            {
              "expr": "mongodb_members_state",
              "legendFormat": "{{`{{member_idx}}`}} ({{`{{member_state}}`}})"
            }
          ]
        },
        {
          "id": 5,
          "title": "Log volume by service (#54)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum by (service) (count_over_time({service=~\".+\"}[1m]))"
            }
          ]
        },
        {
          "id": 6,
          "title": "ERROR log rate by service (#54)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum by (service) (rate({service=~\".+\", level=\"ERROR\"}[5m]))"
            }
          ]
        },
        {
          "id": 7,
          "title": "k6 load test: request rate & VUs (load-test/)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": null,
          "targets": [
            {
              "expr": "rate(k6_http_reqs_total[1m])",
              "legendFormat": "requests/sec"
            },
            {
              "expr": "k6_vus",
              "legendFormat": "active VUs"
            }
          ]
        },
        {
          "id": 8,
          "title": "k6 load test: order create latency (load-test/)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": null,
          "targets": [
            {
              "expr": "k6_order_create_duration_p95",
              "legendFormat": "p95"
            },
            {
              "expr": "k6_order_create_duration_p99",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 9,
          "title": "Recent POST /api/orders traces (Jaeger, #46)",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "datasource": { "type": "jaeger", "uid": "jaeger" },
          "targets": [
            {
              "refId": "A",
              "queryType": "search",
              "service": "order-service",
              "operation": "http post /api/orders",
              "tags": "",
              "minDuration": "",
              "maxDuration": "",
              "limit": 20
            }
          ]
        }
      ]
    }
{{- end }}
