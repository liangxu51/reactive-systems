{{- if .Values.orderService.enabled }}
{{- if or .Values.orderServiceVt.enabled .Values.orderServiceCs.enabled }}
{{- fail "orderService, orderServiceVt, and orderServiceCs are mutually-exclusive alternatives (all three bind the same order-service Kafka topic/Mongo collection) - enable only one." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    # order-service/order-service-vt/order-service-cs are mutually exclusive
    # and share this same Service name (see order-service-vt.yaml/
    # order-service-cs.yaml) - this shared label lets a single ServiceMonitor
    # (see monitoring-servicemonitors.yaml) cover whichever one is actually
    # enabled.
    monitoring: order-service
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orderService.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      {{- include "reactive-systems.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-mongo-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.mongodb.serviceName }} {{ .Values.mongodb.port }} && nc -z {{ .Values.kafka.serviceName }} {{ .Values.kafka.port }}; do
                echo waiting for mongo-db and kafka-broker; sleep 2;
              done
      containers:
        - name: order-service
          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "reactive-systems.mongoUriEnv" . | nindent 12 }}
            {{- include "reactive-systems.apiAuthEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.orderService.containerPort }}
          resources:
            {{- toYaml .Values.appResources.jvm | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.orderService.containerPort }}
            initialDelaySeconds: 15
          livenessProbe:
            tcpSocket:
              port: {{ .Values.orderService.containerPort }}
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
    monitoring: order-service
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: {{ .Values.orderService.servicePort }}
      targetPort: {{ .Values.orderService.containerPort }}
{{- end }}
