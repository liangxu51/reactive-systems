{{- if .Values.orderServiceVt.enabled }}
{{- if or .Values.orderService.enabled .Values.orderServiceCs.enabled }}
{{- fail "orderService, orderServiceVt, and orderServiceCs are mutually-exclusive alternatives (all three bind the same order-service Kafka topic/Mongo collection) - enable only one." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-vt
  labels:
    app: order-service-vt
    # Shared with order-service.yaml/order-service-cs.yaml's Deployments/
    # Service - see order-service.yaml's comment for why (mutually
    # exclusive, same Service name, one ServiceMonitor covers whichever is
    # enabled).
    monitoring: order-service
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orderServiceVt.replicaCount }}
  selector:
    matchLabels:
      app: order-service-vt
  template:
    metadata:
      labels:
        app: order-service-vt
    spec:
      {{- include "reactive-systems.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-mongo-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.mongodb.serviceName }} {{ .Values.mongodb.port }} && nc -z {{ .Values.kafka.serviceName }} {{ .Values.kafka.port }}; do
                echo waiting for mongo-db and kafka-broker; sleep 2;
              done
      containers:
        - name: order-service-vt
          image: "{{ .Values.orderServiceVt.image.repository }}:{{ .Values.orderServiceVt.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "reactive-systems.mongoUriEnv" . | nindent 12 }}
            {{- include "reactive-systems.apiAuthEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.orderServiceVt.containerPort }}
          resources:
            {{- toYaml .Values.appResources.jvm | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.orderServiceVt.containerPort }}
            initialDelaySeconds: 15
          livenessProbe:
            tcpSocket:
              port: {{ .Values.orderServiceVt.containerPort }}
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  # Named "order-service" (not "order-service-vt") so it's a drop-in
  # replacement for the order-service Service that the frontend and
  # port-forward instructions target.
  name: order-service
  labels:
    app: order-service-vt
    monitoring: order-service
    {{- include "reactive-systems.labels" . | nindent 4 }}
spec:
  selector:
    app: order-service-vt
  ports:
    - name: http
      port: {{ .Values.orderServiceVt.servicePort }}
      targetPort: {{ .Values.orderServiceVt.containerPort }}
{{- end }}
