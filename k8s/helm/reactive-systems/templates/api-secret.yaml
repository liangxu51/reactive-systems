# Password generated once (not committed to values.yaml) and persisted
# across `helm upgrade` via `lookup` - without this, every upgrade would
# mint a new random password, silently invalidating any credential already
# handed out. Same pattern as mongo-secret.yaml, applied to the shared HTTP
# Basic API credential (SEC-001, PR #72).
#
# Deliberately NOT annotated helm.sh/resource-policy: keep, unlike
# mongo-secret.yaml and grafana-admin-secret.yaml. Those two must agree with
# state on a PVC that outlives the release, so regenerating them on reinstall
# breaks authentication against data that still holds the old password. This
# credential has no persisted counterpart - the gateway injects it and the
# backends verify it, both reading this same Secret in this same release, so
# they rotate together and a fresh password on reinstall is simply the new
# credential. Keeping it would orphan a Secret on uninstall for no benefit.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "api-credentials" }}
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
  labels:
    {{- include "reactive-systems.labels" . | nindent 4 }}
type: Opaque
data:
  # Not secret (mirrors api.auth.username in plain values.yaml) - included
  # here purely so ServiceMonitor's basicAuth (#55, see
  # monitoring-servicemonitors.yaml) has a single Secret to point both its
  # username and password secretKeyRefs at; that CRD field requires both to
  # come from a Secret, it has no plain-value option.
  username: {{ .Values.api.auth.username | b64enc }}
  password: {{ or (dig "data" "password" "" $existing) (randAlphaNum 32 | b64enc) }}
