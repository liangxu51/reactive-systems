apiVersion: v2
name: reactive-systems
description: Helm chart for the reactive order-processing pipeline (order, inventory, shipping services, Kafka, MongoDB, frontend), intended for local minikube use.
type: application
version: 0.1.0
appVersion: "0.0.5"
dependencies:
  # Monitoring & alerting (#55) - Prometheus Operator + Grafana + Alertmanager
  # + kube-state-metrics + node-exporter, bundled. Replaces the hand-rolled
  # prometheus.yaml Deployment from #44: that ConfigMap-driven scrape config
  # doesn't scale past a handful of hand-edited targets, where this chart's
  # ServiceMonitor/PrometheusRule CRDs (see monitoring-servicemonitors.yaml/
  # monitoring-rules.yaml) are the standard way any future service opts in.
  - name: kube-prometheus-stack
    version: "~66.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled
